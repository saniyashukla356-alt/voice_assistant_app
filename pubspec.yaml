name: vaani_ai
description: Vaani AI

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_dotenv: ^5.2.1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  audioplayers: ^6.0.0
  alarm: ^5.1.4
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/alarm.mp3
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/vaani_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true